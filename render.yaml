services:
  - type: web
    name: edupredict-academic
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_classifier:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
